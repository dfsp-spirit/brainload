name: unittests

on:
  push:
  pull_request:

jobs:
  unittests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run unit tests
        run: pytest
